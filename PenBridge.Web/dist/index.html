<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="같은 Wi-Fi의 PenBridge PC에 연결합니다.">
<title>PenBridge 연결</title>
<style>
:root{color-scheme:light;--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--surface:#fff;--line:#d2d2d7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#f5f5f7;color:var(--ink)}body{min-height:100dvh;background:radial-gradient(circle at 50% -20%,#fff 0,#f5f5f7 48%,#ececf0 100%);display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}.shell{width:min(100%,520px)}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:var(--ink);color:#fff;font-size:25px;font-weight:650;box-shadow:0 14px 35px #1d1d1f24}.eyebrow{margin:28px 0 8px;color:var(--muted);font-size:13px;font-weight:550}.title{font-size:clamp(38px,9vw,58px);line-height:.98;letter-spacing:-.055em;margin:0;max-width:460px;text-wrap:balance;word-break:keep-all}.lead{font-size:17px;line-height:1.55;color:var(--muted);margin:18px 0 30px;max-width:430px;text-wrap:pretty;word-break:keep-all}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:28px;padding:10px;box-shadow:0 30px 80px #34343a18,0 2px 8px #34343a0d;backdrop-filter:blur(24px)}.field{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;border-bottom:1px solid #ededf0}.field label{font-size:14px;font-weight:550;white-space:nowrap}.field input{min-width:0;flex:1;border:0;background:transparent;padding:15px 0;font:16px ui-monospace,SFMono-Regular,monospace;color:var(--ink);outline:0}.field:focus-within{box-shadow:inset 0 0 0 2px #0071e344;border-radius:18px}.primary,.scan{border:0;font:600 16px inherit;border-radius:18px;min-height:52px;transition:transform .18s ease,filter .18s ease}.primary:active,.scan:active{transform:scale(.98)}.primary{width:100%;margin-top:10px;background:var(--blue);color:#fff}.scan{width:100%;margin-top:10px;background:#e8e8ed;color:var(--ink)}.status{min-height:22px;margin:12px 8px 2px;color:var(--muted);font-size:13px;line-height:1.5}.status.error{color:#c9342f}.recent{margin-top:22px}.recent h2{font-size:13px;color:var(--muted);font-weight:550;margin:0 0 9px 10px}.recent button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border:0;border-radius:17px;background:#ffffffa8;color:var(--ink);font:500 14px inherit}.recent code{color:var(--muted)}dialog{width:min(440px,calc(100% - 28px));border:0;border-radius:30px;padding:14px;background:#111;color:#fff;box-shadow:0 36px 100px #0006}dialog::backdrop{background:#0008;backdrop-filter:blur(10px)}.camera{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:20px;background:#222}.scanbar{display:flex;justify-content:space-between;align-items:center;padding:13px 5px 3px}.scanbar p{margin:0;font-size:14px}.scanbar button{border:0;border-radius:14px;padding:10px 14px;background:#2c2c2e;color:#fff;font:600 14px inherit}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{display:block}.shell{margin:clamp(20px,7vh,64px) auto}</style>
</head>
<body><main class="shell"><div class="mark">P</div><p class="eyebrow">같은 Wi-Fi에서 바로 연결</p><h1 class="title">작업할 컴퓨터를 선택하세요.</h1><p class="lead">PC의 PenBridge에 표시된 IP 주소를 입력하거나 QR 코드를 카메라로 비추세요.</p><section class="panel" aria-label="컴퓨터 연결"><div class="field"><label for="address">PC 주소</label><input id="address" inputmode="url" autocomplete="off" placeholder="192.168.0.12:8080" aria-describedby="status"></div><button class="primary" id="connect">연결</button><button class="scan" id="scan">QR 코드 스캔</button><p class="status" id="status" role="status">PC와 iPad가 같은 Wi-Fi인지 확인하세요.</p></section><section class="recent" id="recent" hidden><h2>최근 연결</h2><button id="recentButton"><span>PenBridge PC</span><code id="recentAddress"></code></button></section></main><dialog id="scanner"><video class="camera" id="camera" playsinline muted></video><canvas id="scanCanvas" hidden></canvas><div class="scanbar"><p>QR 코드를 사각형 안에 맞추세요.</p><button id="closeScanner">닫기</button></div></dialog>
<script>
const input=document.querySelector('#address'),status=document.querySelector('#status'),scanner=document.querySelector('#scanner'),video=document.querySelector('#camera'),canvas=document.querySelector('#scanCanvas');let stream=null,scanning=false,qrDetector=null;
function parseAddress(value){let text=String(value||'').trim();try{const qr=new URL(text);text=qr.host;}catch{}const match=text.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?$/);if(!match)return null;const octets=match[1].split('.').map(Number),port=Number(match[2]||8080);if(octets.some(n=>n>255)||port<1||port>65535)return null;const privateIp=octets[0]===10||(octets[0]===127)||(octets[0]===172&&octets[1]>=16&&octets[1]<=31)||(octets[0]===192&&octets[1]===168)||(octets[0]===169&&octets[1]===254);return privateIp?`${match[1]}:${port}`:null;}
function connect(value=input.value){const address=parseAddress(value);if(!address){status.className='status error';status.textContent='같은 네트워크의 사설 IP 주소와 포트를 확인하세요.';return;}localStorage.setItem('penbridge.lastAddress',address);const assets=new URL('./',location.href).href;location.href=`http://${address}/connect?assets=${encodeURIComponent(assets)}`;}
document.querySelector('#connect').onclick=()=>connect();document.querySelector('#recentButton').onclick=()=>connect(document.querySelector('#recentAddress').textContent);input.addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
input.addEventListener('input',()=>{status.className='status';status.textContent='PC와 iPad가 같은 Wi-Fi인지 확인하세요.';});
const recent=localStorage.getItem('penbridge.lastAddress');if(recent){document.querySelector('#recent').hidden=false;document.querySelector('#recentAddress').textContent=recent;}
async function loadJsQr(){if(window.jsQR)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=resolve;s.onerror=reject;document.head.append(s);});}
async function openScanner(){try{qrDetector=null;if('BarcodeDetector'in window){const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code'))qrDetector=new BarcodeDetector({formats:['qr_code']});}if(!qrDetector)await loadJsQr();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();scanner.showModal();scanning=true;scanLoop();}catch{status.className='status error';status.textContent='카메라를 열 수 없습니다. Safari의 카메라 권한을 확인하세요.';}}
async function scanLoop(){if(!scanning)return;try{if(qrDetector){const codes=await qrDetector.detect(video);if(codes[0])return acceptQr(codes[0].rawValue);}else if(video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;const c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0);const hit=jsQR(c.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height);if(hit)return acceptQr(hit.data);}}catch{}requestAnimationFrame(scanLoop);}
function acceptQr(value){const address=parseAddress(value);if(!address){status.className='status error';status.textContent='PenBridge 연결 주소가 아닌 QR 코드입니다.';return;}input.value=address;closeScanner();connect(address);}
function closeScanner(){scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;scanner.close();}
document.querySelector('#scan').onclick=openScanner;document.querySelector('#closeScanner').onclick=closeScanner;scanner.addEventListener('cancel',e=>{e.preventDefault();closeScanner();});
</script></body></html>
